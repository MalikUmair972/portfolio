<!-- nav.html — sliding indicator · logo 3D tilt · deep magnetic rotateZ · floating capsule · CTA shimmer -->
<header class="nav-root" [class.scrolled]="scrolled" #navRoot>
  <div class="nav-inner">

    <!-- Logo -->
    <a class="nav-logo" #logoRef
       (click)="handleNavClick({ label:'Home', path:'/', type:'route' })"
       (mousemove)="onLogoMove($event)"
       (mouseleave)="onLogoLeave()">
      <span class="logo-text">MALIK<span class="logo-dot">.</span></span>
    </a>

    <!-- Desktop links wrapper (indicator lives here) -->
    <div class="nav-links-wrap" #linksRef (mouseleave)="onLinksLeave()">
      <span class="nav-indicator" #indicatorRef aria-hidden="true"></span>
      <ul class="nav-links">
        <li *ngFor="let link of links; let i = index" class="nav-item">
          <a class="nav-link"
             [class.is-active]="isActive(link)"
             (mouseenter)="onLinkEnter($event)"
             (mousemove)="onLinkMove($event)"
             (mouseleave)="onLinkLeave($event)"
             (click)="handleNavClick(link)">
            <span class="link-label">{{ link.label }}</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- CTA -->
    <a class="nav-cta" #ctaRef
       (click)="handleNavClick({ label:'Contact', path:'/contact', type:'route' })"
       (mousemove)="onCtaMove($event)"
       (mouseleave)="onCtaLeave()">
      <span>Let's Talk</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>

    <!-- Burger -->
    <button class="nav-burger" [class.open]="mobileOpen" (click)="toggleMobile()" aria-label="Toggle menu">
      <span></span>
      <span></span>
    </button>

  </div>
</header>

<!-- Mobile full-screen overlay -->
<div class="mobile-overlay" [class.active]="mobileOpen">
  <div class="mobile-overlay-inner">
    <nav class="mobile-nav">
      <a *ngFor="let link of links; let i = index"
         class="mobile-link"
         [style.animation-delay]="mobileOpen ? (i * 0.07 + 0.1) + 's' : '0s'"
         (click)="handleNavClick(link)">
        <span class="mobile-link-num">0{{ i + 1 }}</span>
        <span class="mobile-link-text">{{ link.label }}</span>
        <svg class="mobile-link-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>
    </nav>
    <div class="mobile-footer">
      <p class="mobile-footer-text">Creative Developer · Lahore, PK</p>
    </div>
  </div>
</div>
