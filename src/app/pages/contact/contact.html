<!-- contact.html -->
<main class="contact-page">
  <div class="contact-container">

    <!-- Left: Info panel -->
    <div class="contact-info" #infoRef>
      <span class="contact-eyebrow">Get in touch</span>
      <h1 class="contact-title">Let's create<br><em>something great</em></h1>
      <p class="contact-sub">
        Have a project in mind? I'd love to help bring<br>your vision to life.
      </p>

      <div class="contact-details">
        <a href="mailto:malik@example.com" class="contact-detail">
          <span class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <span>malik@example.com</span>
        </a>

        <a href="tel:+923001234567" class="contact-detail">
          <span class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
          </span>
          <span>+92 300 123 4567</span>
        </a>

        <div class="contact-detail">
          <span class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </span>
          <span>Lahore, Pakistan</span>
        </div>
      </div>

      <div class="social-links">
        <a href="#" target="_blank" class="social-link">GitHub</a>
        <a href="#" target="_blank" class="social-link">LinkedIn</a>
        <a href="#" target="_blank" class="social-link">Dribbble</a>
        <a href="#" target="_blank" class="social-link">Twitter</a>
      </div>
    </div>

    <!-- Right: Form panel -->
    <div class="contact-form-wrap" #formRef>

      <form *ngIf="!submitted"
            [formGroup]="contactForm"
            (ngSubmit)="onSubmit()"
            class="contact-form"
            novalidate>

        <div class="form-row">
          <div class="form-field"
               [class.focused]="nameFocused"
               [class.filled]="contactForm.get('name')?.value">
            <input id="name" type="text" formControlName="name" autocomplete="off"
                   (focus)="nameFocused=true" (blur)="nameFocused=false">
            <label for="name">Your Name</label>
            <span class="field-line"></span>
          </div>

          <div class="form-field"
               [class.focused]="emailFocused"
               [class.filled]="contactForm.get('email')?.value">
            <input id="email" type="email" formControlName="email" autocomplete="off"
                   (focus)="emailFocused=true" (blur)="emailFocused=false">
            <label for="email">Email Address</label>
            <span class="field-line"></span>
          </div>
        </div>

        <div class="form-field"
             [class.focused]="subjectFocused"
             [class.filled]="contactForm.get('subject')?.value">
          <input id="subject" type="text" formControlName="subject" autocomplete="off"
                 (focus)="subjectFocused=true" (blur)="subjectFocused=false">
          <label for="subject">Subject</label>
          <span class="field-line"></span>
        </div>

        <div class="form-field textarea-field"
             [class.focused]="messageFocused"
             [class.filled]="contactForm.get('message')?.value">
          <textarea id="message" formControlName="message" rows="5"
                    (focus)="messageFocused=true" (blur)="messageFocused=false"></textarea>
          <label for="message">Your Message</label>
          <span class="field-line"></span>
        </div>

        <button type="submit" class="submit-btn" [class.loading]="loading">
          <span class="btn-text">{{ loading ? 'Sending…' : 'Send Message' }}</span>
          <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <!-- Success state -->
      <div class="contact-success" *ngIf="submitted">
        <div class="success-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h3>Message sent!</h3>
        <p>Thanks for reaching out. I'll get back to you within 24 hours.</p>
        <button class="back-btn" (click)="resetForm()">Send another</button>
      </div>

    </div>

  </div>
</main>
